# Mod Attributes
modId=lockedinslots
modName=Locked In Slots
modVersion=21.10.1
modAuthor=Fuzs
modDescription=Lock your inventory slots. Protect your tools. Prevent accidents, fully client-side.
modLicense=MPL-2.0
modSourceUrl=https://github.com/Fuzss/locked-in-slots
modIssueUrl=https://github.com/Fuzss/locked-in-slots/issues
modUpdateUrl=https://raw.githubusercontent.com/Fuzss/modresources/main/update/lockedinslots.json
modMavenGroup=fuzs.lockedinslots
# "MATCH_VERSION" for a mod required on both sides, "IGNORE_SERVER_VERSION" for a server only mod, "IGNORE_ALL_VERSION" for a client only mod
modForgeDisplayTest=IGNORE_ALL_VERSION
# "*" for a mod loaded on both sides, "server" for a server only mod, "client" for a client only mod
modFabricEnvironment=client

